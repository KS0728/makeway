<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make Way – Live Emergency Vehicles</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
  :root{--ink:#14213d;--paper:#fff;--fire:#d62828;--amb:#0077b6;--warn:#ffb703;--line:#dde3ea}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
  #app{display:flex;flex-direction:column;height:100%}
  header{padding:10px 16px;background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0}
  header span{font-size:13px;opacity:.8}
  #alert{display:none;padding:12px 16px;background:var(--warn);font-weight:700;font-size:15px}
  #alert.on{display:block;animation:blink 1s infinite alternate}
  @keyframes blink{to{background:#ffd166}}
  main{flex:1;display:flex;min-height:0}
  #map{flex:1}
  aside{width:280px;overflow:auto;border-left:1px solid var(--line);padding:12px;background:var(--paper)}
  aside h2{font-size:14px;margin:0 0 8px}
  .veh{width:100%;text-align:left;display:flex;gap:10px;align-items:center;padding:10px;margin-bottom:8px;border:1px solid var(--line);border-left-width:5px;border-radius:6px;background:#fff;cursor:pointer;font:inherit;color:inherit}
  .veh.fire{border-left-color:var(--fire)} .veh.ambulance{border-left-color:var(--amb)}
  .veh b{display:block;font-size:14px} .veh small{color:#5b6777}
  .veh:focus-visible{outline:3px solid var(--ink)}
  .legend{font-size:12px;color:#5b6777;margin-top:12px;line-height:1.5}
  .pin{font-size:26px;line-height:1;text-align:center;filter:drop-shadow(0 1px 2px #0006)}
  .pulse{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;animation:p 1.4s infinite}
  .fire .pulse{background:var(--fire)} .ambulance .pulse{background:var(--amb)}
  @keyframes p{from{transform:scale(1);opacity:.7}to{transform:scale(4);opacity:0}}
    .plan input{margin-bottom:8px;padding:10px;font-size:14px;border:1px solid var(--line);border-radius:6px;width:100%}
  .plan button{width:100%;padding:11px;font-size:15px;font-weight:700;color:#fff;background:var(--ink);border:0;border-radius:6px;cursor:pointer}
  .plan button:focus-visible,.plan input:focus-visible{outline:3px solid var(--warn)}
  #pmsg{font-size:13px;margin:8px 0 14px;line-height:1.4}
  #pmsg.ok{color:#1d7a6f} #pmsg.divert{color:#8a5a00;font-weight:700} #pmsg.bad{color:var(--fire);font-weight:700}
  @media(max-width:700px){main{flex-direction:column}aside{width:100%;max-height:46%;border-left:0;border-top:1px solid var(--line)}}
  @media(prefers-reduced-motion:reduce){#alert.on,.pulse{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header><h1>Make Way: live emergency vehicles</h1><span id="status">Connecting…</span></header>
  <div id="alert" role="alert"></div>
  <main>
    <div id="map"></div>
    <aside>
      <h2>Plan a safe route</h2>
      <div class="plan">
        <input id="pfrom" placeholder="From (blank = my location)" aria-label="From">
        <input id="pto" placeholder="To (address or place)" aria-label="To">
        <button id="pgo">Find safe route</button>
        <div id="pmsg" role="status" aria-live="polite"></div>
      </div>
      <h2>Active vehicles</h2>
      <div id="list"></div>
      <div class="legend">Shaded corridors are roads an emergency vehicle is about to use. If you are driving on one, pull over to the left/side and let it pass.</div>
    </aside>
  </main>
</div>

<script>
/* ============ CONFIG ============ */
// Set FEED_URL to your backend endpoint to show REAL vehicles. Leave null for the demo simulation.
// Endpoint must return JSON: [{ id, type: "fire"|"ambulance", name, lat, lng, route: [[lat,lng],...] }]
const FEED_URL = '/api/vehicles';
const POLL_MS = 3000;
const ALERT_RADIUS_M = 300;
const CENTER = [13.0827, 80.2707]; // Chennai
/* ================================= */

const COLORS = {fire:'#d62828', ambulance:'#0077b6'};
const ICONS = {fire:'🚒', ambulance:'🚑'};
const map = L.map('map',{dragging:true,scrollWheelZoom:true}).setView(CENTER, 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);

const layers = {}; // id -> {marker, corridor, line, data}
let me = null, meMarker = null;

function dist(a,b){ // haversine metres
  const R=6371000,t=x=>x*Math.PI/180;
  const dLa=t(b[0]-a[0]),dLo=t(b[1]-a[1]);
  const h=Math.sin(dLa/2)**2+Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

function upsert(v){
  let L_ = layers[v.id];
  if(!L_){
    const icon = L.divIcon({className:'',iconSize:[30,30],iconAnchor:[15,15],
      html:`<div class="${v.type}" style="position:relative"><div class="pulse"></div><div class="pin">${ICONS[v.type]}</div></div>`});
    L_ = layers[v.id] = {
      marker:L.marker([v.lat,v.lng],{icon,zIndexOffset:1000}).addTo(map).bindTooltip(v.name),
      corridor:L.polyline(v.route,{color:COLORS[v.type],weight:26,opacity:.15,lineCap:'round'}).addTo(map),
      line:L.polyline(v.route,{color:COLORS[v.type],weight:4,dashArray:'8 8'}).addTo(map)
    };
  }
  L_.data=v;
  L_.marker.setLatLng([v.lat,v.lng]);
  L_.corridor.setLatLngs(v.route);
  L_.line.setLatLngs(v.route);
}

function render(vehicles){
  const ids=new Set(vehicles.map(v=>v.id));
  Object.keys(layers).forEach(id=>{ if(!ids.has(id)){ ['marker','corridor','line'].forEach(k=>map.removeLayer(layers[id][k])); delete layers[id]; }});
  vehicles.forEach(upsert);
  document.getElementById('list').innerHTML = vehicles.map(v=>
    `<button class="veh ${v.type}" data-id="${v.id}"><span class="pin">${ICONS[v.type]}</span><span><b>${v.name}</b><small>${v.type==='fire'?'Fire engine':'Ambulance'} · on the move</small></span></button>`
  ).join('') || '<small>No emergency vehicles active right now.</small>';
  document.querySelectorAll('.veh').forEach(b=>b.onclick=()=>map.flyTo(layers[b.dataset.id].marker.getLatLng(),16));
  document.getElementById('status').textContent='Updated '+new Date().toLocaleTimeString();
  checkAlert(vehicles);
  evaluate();
}

function checkAlert(vehicles){
  const box=document.getElementById('alert');
  if(!me){box.className='';return;}
  const hit=vehicles.filter(v=>v.route.some(p=>dist(me,p)<ALERT_RADIUS_M));
  if(hit.length){
    box.textContent='Give way: '+hit.map(v=>v.name).join(', ')+' approaching on your road. Move to the side and let it pass.';
    box.className='on';
  } else box.className='';
}

/* Your location (optional, only used in your browser to show the warning) */
if(navigator.geolocation){
  navigator.geolocation.watchPosition(pos=>{
    me=[pos.coords.latitude,pos.coords.longitude];
    if(!meMarker) meMarker=L.circleMarker(me,{radius:8,color:'#fff',weight:3,fillColor:'#14213d',fillOpacity:1}).addTo(map).bindTooltip('You');
    else meMarker.setLatLng(me);
    checkAlert(Object.values(layers).map(l=>l.data));
  },()=>{},{enableHighAccuracy:true});
}


/* ============ Safe route planner ============ */
let plan=null, planLayer=null, lastPick=-1, lastEval=0;
const pmsg=(t,c)=>{const e=document.getElementById('pmsg');e.textContent=t;e.className=c||'';};

async function geocode(q){
  const g=await (await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q))).json();
  if(!g[0]) throw new Error('nf');
  return [parseFloat(g[0].lat),parseFloat(g[0].lon)];
}
function densify(pts,step){ // add a point every ~step metres
  const out=[];
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i],b=pts[i+1],n=Math.max(1,Math.round(dist(a,b)/step));
    for(let k=0;k<n;k++) out.push([a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n]);
  }
  if(pts.length) out.push(pts[pts.length-1]);
  return out;
}
// Returns vehicles that will use the same road as this route (about 160 m or more shared, ahead of the vehicle)
function conflicts(route,vehicles){
  const u=densify(route,20), hits=[];
  vehicles.forEach(v=>{
    if(!v.route||!v.route.length) return;
    let idx=0,best=1e9;
    v.route.forEach((p,i)=>{const d=dist([v.lat,v.lng],p); if(d<best){best=d;idx=i;}});
    const vr=densify([[v.lat,v.lng],...v.route.slice(idx)],20);
    let n=0;
    for(const p of u){
      for(const q of vr){
        if(Math.abs(p[0]-q[0])<0.0006&&Math.abs(p[1]-q[1])<0.0006&&dist(p,q)<35){n++;break;}
      }
    }
    if(n>=8) hits.push({v,n});
  });
  return hits;
}

async function findRoute(){
  const fromT=document.getElementById('pfrom').value.trim(), toT=document.getElementById('pto').value.trim();
  if(!toT){pmsg('Type a destination.');return;}
  if(!fromT&&!me){pmsg('Allow location access or type a starting point.');return;}
  pmsg('Finding routes…');
  try{
    const a=fromT?await geocode(fromT):me, b=await geocode(toT);
    const u=`https://router.project-osrm.org/route/v1/driving/${a[1]},${a[0]};${b[1]},${b[0]}?alternatives=3&overview=full&geometries=geojson`;
    const j=await (await fetch(u)).json();
    if(!j.routes||!j.routes.length){pmsg('No route found.','bad');return;}
    plan={alts:j.routes.map(r=>({coords:r.geometry.coordinates.map(c=>[c[1],c[0]]),min:r.duration/60}))};
    lastPick=-1; lastEval=0; evaluate(true);
    map.fitBounds(L.polyline(plan.alts[0].coords).getBounds(),{padding:[30,30]});
  }catch(e){ pmsg(e.message==='nf'?'Place not found. Try a fuller address.':'Could not get a route. Check your internet.','bad'); }
}

function evaluate(force){
  if(!plan) return;
  const now=Date.now(); if(!force&&now-lastEval<3000) return; lastEval=now;
  const vs=Object.values(layers).map(l=>l.data);
  const scored=plan.alts.map((r,i)=>({i,h:conflicts(r.coords,vs)}));
  let pick=scored.find(s=>!s.h.length);
  const clear=!!pick;
  if(!pick) pick=scored.slice().sort((x,y)=>x.h.reduce((t,o)=>t+o.n,0)-y.h.reduce((t,o)=>t+o.n,0))[0];
  const r=plan.alts[pick.i];
  if(planLayer) map.removeLayer(planLayer);
  planLayer=L.polyline(r.coords,{color:clear?'#2a9d8f':'#f77f00',weight:6,opacity:.9}).addTo(map);
  const mins=Math.round(r.min);
  if(pick.i!==lastPick||force){
    if(clear&&pick.i===0) pmsg(`Your route is clear. About ${mins} min.`,'ok');
    else if(clear) pmsg(`Emergency vehicle on your usual route. You have been diverted (about ${mins} min).`,'divert');
    else pmsg(`No clear alternative. ${pick.h.map(o=>o.v.name).join(', ')} will use this road. Drive carefully and give way.`,'bad');
    lastPick=pick.i;
  }
}
document.getElementById('pgo').onclick=findRoute;

/* ============ Real feed ============ */
async function poll(){
  try{
    const r=await fetch(FEED_URL); render(await r.json());
  }catch(e){ document.getElementById('status').textContent='Feed unavailable, retrying…'; }
}

/* ============ Demo simulation ============ */
const DEMO=[
  {id:'A1',type:'ambulance',name:'Ambulance A1',from:[12.9716,77.5946],to:[12.9352,77.6245]},
  {id:'F1',type:'fire',name:'Fire Engine F1',from:[12.9985,77.5530],to:[12.9784,77.6408]}
];
async function buildRoute(d){
  try{
    const u=`https://router.project-osrm.org/route/v1/driving/${d.from[1]},${d.from[0]};${d.to[1]},${d.to[0]}?overview=full&geometries=geojson`;
    const j=await (await fetch(u)).json();
    return j.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);
  }catch(e){ return [d.from,d.to]; } // fallback: straight line
}
async function startDemo(){
  const sims=await Promise.all(DEMO.map(async d=>{
    const route=await buildRoute(d);
    const cum=[0]; for(let i=1;i<route.length;i++) cum.push(cum[i-1]+dist(route[i-1],route[i]));
    return {...d,route,cum,pos:0};
  }));
  const SPEED=25; // metres per second (demo)
  setInterval(()=>{
    const out=sims.map(s=>{
      s.pos=(s.pos+SPEED*1)%s.cum[s.cum.length-1];
      let i=1; while(i<s.cum.length-1&&s.cum[i]<s.pos)i++;
      const t=(s.pos-s.cum[i-1])/((s.cum[i]-s.cum[i-1])||1);
      const a=s.route[i-1],b=s.route[i];
      return {id:s.id,type:s.type,name:s.name,lat:a[0]+(b[0]-a[0])*t,lng:a[1]+(b[1]-a[1])*t,route:s.route.slice(i-1)};
    });
    render(out);
  },1000);
}

FEED_URL ? (poll(),setInterval(poll,POLL_MS)) : startDemo();
</script>
</body>
</html>
